name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hatocontrol
          POSTGRES_USER: hatocontrol
          POSTGRES_PASSWORD: prueba-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hatocontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BD_URL: jdbc:postgresql://localhost:5432/hatocontrol
      BD_USUARIO: hatocontrol
      BD_CONTRASENA: prueba-ci
    steps:
      - uses: actions/checkout@v4
      - name: Traer los scripts de la base de datos
        uses: actions/checkout@v4
        with:
          repository: Chindoy12/HatoControl-db
          path: bd
      - name: Crear las tablas y cargar los datos de prueba
        run: >
          docker run --rm --network host -v "$PWD/bd:/proyecto"
          flyway/flyway:11
          -url=$BD_URL -user=$BD_USUARIO -password=$BD_CONTRASENA
          -locations=filesystem:/proyecto/migraciones,filesystem:/proyecto/datos-prueba
          migrate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: mvn -B -ntp verify
      - name: Listar el resultado de cada prueba
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for archivo in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for caso in ET.parse(archivo).getroot().iter('testcase'):
                  fallo = caso.find('failure') is not None or caso.find('error') is not None
                  clase = caso.get('classname').split('.')[-1]
                  print(f"PRUEBA | {clase} | {caso.get('name')} | {'FALLA' if fallo else 'PASA'} | {caso.get('time')} s")
          PY
      - name: Guardar el jar para el despliegue
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/hatocontrol-backend-*.jar
          retention-days: 7
      - name: Publicar el jar de prueba
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prueba >/dev/null 2>&1 || gh release create prueba --prerelease --title "Versión de prueba" --notes "Jar compilado automáticamente para revisar el frontend. No es una entrega."
          gh release upload prueba target/hatocontrol-backend-*.jar --clobber

  # Fase 12: despliega en AWS con el rol que crea infraestructura/hatocontrol.yaml (OIDC, sin claves guardadas).
  # Solo corre cuando existe la variable del repositorio AWS_ROL_DESPLIEGUE.
  desplegar:
    needs: compilar
    if: github.event_name == 'push' && vars.AWS_ROL_DESPLIEGUE != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency: despliegue
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jar
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROL_DESPLIEGUE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Subir el jar y desplegar en el servidor
        run: |
          salidas=$(aws cloudformation describe-stacks --stack-name hatocontrol --query 'Stacks[0].Outputs' --output json)
          salida() { jq -r --arg k "$1" '.[] | select(.OutputKey == $k) | .OutputValue' <<< "$salidas"; }
          bucket=$(salida Artefactos); servidor=$(salida Servidor); url=$(salida UrlBackend)
          aws s3 cp hatocontrol-backend-*.jar "s3://$bucket/hatocontrol.jar" --only-show-errors
          comando=$(aws ssm send-command --instance-ids "$servidor" --document-name AWS-RunShellScript \
            --comment "Despliegue ${GITHUB_SHA::7}" --timeout-seconds 900 \
            --parameters 'commands=["/opt/hatocontrol/desplegar.sh"]' --query Command.CommandId --output text)
          # El primer despliegue descarga Flyway y migra la base: se espera hasta 15 minutos
          for intento in $(seq 1 90); do
            estado=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$servidor" --query Status --output text 2>/dev/null || echo Pending)
            case "$estado" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$comando" --instance-id "$servidor" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          estado=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$servidor" --query Status --output text)
          echo "Estado del despliegue: $estado"
          test "$estado" = Success
          codigo=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/sesion")
          echo "$url/api/sesion respondió $codigo (se espera 401 sin sesión)"
          test "$codigo" = 401
